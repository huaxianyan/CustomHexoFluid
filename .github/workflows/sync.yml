name: Sync Fluid and build deploy release

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7 7 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0

      - name: Download upstream and overlay custom branch
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          LATEST_TAG=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            https://api.github.com/repos/fluid-dev/hexo-theme-fluid/releases/latest | jq -r '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo 'Unable to determine the latest Fluid release.' >&2
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          UPSTREAM_DIR=$(mktemp -d)
          CUSTOM_DIR=$(mktemp -d)

          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            "https://github.com/fluid-dev/hexo-theme-fluid/archive/refs/tags/${LATEST_TAG}.tar.gz" \
            | tar -xz -C "$UPSTREAM_DIR" --strip-components=1

          git archive origin/main README.md _config.yml layout scripts source .github/workflows/sync.yml \
            | tar -x -C "$CUSTOM_DIR"

          # deploy 始终是完整上游主题；先完整同步，再覆盖 main 分支中的个人修改。
          rsync -a --delete --exclude='.git/' "$UPSTREAM_DIR/" ./
          rm -rf .github
          cp -a "$CUSTOM_DIR/.github" ./.github
          cp -a "$CUSTOM_DIR/README.md" ./README.md
          cp -a "$CUSTOM_DIR/_config.yml" ./_config.yml
          cp -a "$CUSTOM_DIR/layout/." ./layout/
          cp -a "$CUSTOM_DIR/scripts/." ./scripts/
          cp -a "$CUSTOM_DIR/source/." ./source/

      - name: Commit merged theme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: merge Fluid ${{ steps.prepare.outputs.tag }} with custom overrides"
            git push origin HEAD:deploy
          fi

      - name: Package merged theme
        shell: bash
        run: |
          mkdir -p release_dist
          zip -qr "release_dist/hexo-theme-fluid-${{ steps.prepare.outputs.tag }}.zip" . \
            -x '.git/*' 'release_dist/*'

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'release_dist/*'
          allowUpdates: true
          replacesArtifacts: true
          tag: ${{ steps.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
